<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coverage</title>
<style>
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  .fancy::before { content: ""; display: inline-block; width: 12px; height: 12px; border: 1px solid #333; margin-right: 4px; }
  label { display: block; margin: 2px 0; }
  iframe { width: 420px; height: 140px; border: 1px solid #999; }
</style>
<script src="/oracle.js"></script>
</head>
<body>
<!-- C2 coverage fixture. Expected lines are written in test/acceptance/C.test.ts (C2 spec). -->
<header>
  <a href="/nav-a.html">Coverage link</a>
</header>
<main>
  <h1>Coverage page</h1>
  <button id="btn" type="button" onclick="__count('btn')">Coverage button</button>
  <button type="button" disabled>Disabled button</button>
  <button type="button" aria-pressed="true">Toggle pressed</button>
  <button type="button" aria-expanded="false">Expandable</button>
  <div style="cursor:pointer" onclick="__count('clickable')">Clickable div</div>

  <form aria-label="All inputs" onsubmit="return false">
    <label>Text input <input type="text" value="hello"></label>
    <label>Email input <input type="email" required></label>
    <label>Password input <input type="password"></label>
    <label>Search input <input type="search"></label>
    <label>Tel input <input type="tel"></label>
    <label>Url input <input type="url"></label>
    <label>Number input <input type="number" value="5"></label>
    <label>Range input <input type="range" min="0" max="10" value="3"></label>
    <label>Date input <input type="date"></label>
    <label>Time input <input type="time"></label>
    <label>Datetime input <input type="datetime-local"></label>
    <label>Month input <input type="month"></label>
    <label>Week input <input type="week"></label>
    <label>Color input <input type="color"></label>
    <label>File input <input type="file"></label>
    <label>Readonly input <input type="text" readonly value="fixed"></label>
    <input type="submit" value="Submit input">
    <input type="reset" value="Reset input">
    <input type="button" value="Button input">
    <input type="hidden" name="hidden_field" value="hidden-field-value">
    <label>Single select
      <select><option>Alpha</option><option selected>Beta</option><option>Gamma</option></select>
    </label>
    <label>Multi select
      <select multiple size="3"><option>One</option><option selected>Two</option><option>Three</option></select>
    </label>
    <label>Notes area <textarea>note text</textarea></label>
    <label><input type="checkbox" checked> Native checkbox</label>
    <fieldset>
      <legend>Native radios</legend>
      <label><input type="radio" name="r" value="a" checked> Radio A</label>
      <label><input type="radio" name="r" value="b"> Radio B</label>
    </fieldset>
    <!-- custom controls: visually hidden focusable input + visible label -->
    <input type="checkbox" id="custom-cb" class="vh"><label for="custom-cb" class="fancy">Custom checkbox</label>
    <input type="radio" id="custom-rd" name="cr" class="vh"><label for="custom-rd" class="fancy">Custom radio</label>
  </form>

  <div contenteditable="true" aria-label="Editable area" style="border:1px solid #888;min-height:2em">editable text</div>

  <div id="shadow-host">
    <template shadowrootmode="open">
      <button type="button">Shadow button</button>
    </template>
  </div>

  <iframe title="Same frame" src="/frame-same.html"></iframe>
  <iframe title="Cross frame" src="__ORIGIN_B__/frame-cross.html"></iframe>

  <dialog open aria-label="Info dialog" style="position:static">
    <p>Dialog body</p>
    <button type="button">Dialog OK</button>
  </dialog>

  <div role="alert">Coverage alert text</div>

  <!-- must be ABSENT from snapshots -->
  <button type="button" style="display:none">Hidden display none</button>
  <button type="button" style="visibility:hidden">Hidden visibility</button>
  <div aria-hidden="true"><button type="button">Hidden aria</button></div>
  <div inert><button type="button">Hidden inert</button></div>
  <details><summary>More details</summary><button type="button">Hidden details</button></details>
  <button type="button" style="width:0;height:0;padding:0;border:0;overflow:hidden;display:inline-block">Hidden zero size</button>
</main>
</body>
</html>
