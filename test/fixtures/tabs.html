<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tab opener</title></head>
<body>
<!-- B3: both open /tab-target.html in a new tab. -->
<h1>Tab opener</h1>
<a id="blank" href="/tab-target.html?via=blank" target="_blank">Open blank</a>
<button id="wopen" type="button" onclick="window.open('/tab-target.html?via=open')">Window open</button>
</body>
</html>
