<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Secret form</title></head>
<body>
<!-- R5 (review-lens decision 5): a GET form whose password field is named "pw" (NOT a redacted
     query-parameter name), so the typed value reaches the URL; a live region echoes the value. -->
<h1>Secret form</h1>
<form method="get" action="/submit" aria-label="Secret form">
  <input type="hidden" name="form" value="secret">
  <label>Password value <input id="pw" name="pw" type="password"></label>
  <button type="submit">Send secret</button>
</form>
<div id="echo" role="status" aria-live="polite"></div>
<script>
  document.getElementById('pw').addEventListener('input', (e) => {
    document.getElementById('echo').textContent = 'You typed ' + e.target.value;
  });
</script>
</body>
</html>
