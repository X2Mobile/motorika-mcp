<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video</title>
<style>body { margin: 0; } video { display: block; width: 640px; height: 360px; }</style>
</head>
<body>
<!-- E1-E6: one 640x360 video, 6 s, second k = COLOR_TABLE[k] (scripts/gen-fixture-video.mjs),
     captions track = media/colors.vtt (CUES). Starts paused at 0, muted. -->
<h1>Video</h1>
<video id="v1" muted preload="auto" playsinline width="640" height="360">
  <source src="/media/colors.webm" type="video/webm">
  <source src="/media/colors.mp4" type="video/mp4">
  <track kind="captions" src="/media/colors.vtt" srclang="en" label="English" default>
</video>
</body>
</html>
